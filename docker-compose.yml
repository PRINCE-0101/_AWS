services:
  postgres:
    image: postgres:17-alpine
    container_name: campusforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - campusforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusforge_pgdata:
